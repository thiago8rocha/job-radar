# Copy to the root of your private repo as job-radar.config.yml
locale: en                   # all generated content is in English

search:
  include: ["QA", "Quality Assurance", "Quality Engineer", "SDET", "Test Automation"]
  ambiguous: []              # include terms too generic on their own, e.g. "Quality Analyst"
  ambiguous_requires: []     # words a title matched only by an ambiguous term must also have
  highlight: ["Playwright", "Cypress", "Selenium", "CI/CD"]  # listed in the issue when the description mentions them
  exclude: ["Intern", "Trainee", "Junior", "Mid-level"]
  seniority: [senior, specialist, staff, lead]
  max_age_days: 15

eligibility:
  accept_regions: [worldwide, latam, americas, brazil]
  # no timezone filter: the required hours are converted to Brasília time in the issue
  reject: ["US only", "EU only", "must reside in"]

work_model: [remote]

sources:
  himalayas: { enabled: true }
  greenhouse: { enabled: true }
  lever: { enabled: true }
  ashby: { enabled: true }
  inhire: { enabled: true }
  gupy: { enabled: false }            # Brazilian portal; needs no key
  freehire: { enabled: false }        # aggregator of ~50 ATS; needs no key
  remoteok: { enabled: false }        # latest ~100 remote jobs; needs no key
  weworkremotely: { enabled: false }  # latest remote jobs from its RSS feed; needs no key
  # Needs the SERPAPI_KEY secret (free plan: 100 searches a month). Each run spends up to max_searches.
  google_jobs: { enabled: false, api_key_secret: SERPAPI_KEY, max_searches: 3 }

discovery:
  enabled: false             # needs the SERPAPI_KEY secret; the weekly `discover` workflow opens a pull request
  max_searches: 8
  queries:
    - 'site:inhire.app/vagas QA'
    - 'site:boards.greenhouse.io "QA" remote'
    - 'site:jobs.lever.co "quality assurance"'
    - 'site:jobs.ashbyhq.com QA'

issues:
  max_per_run: 25            # guard against flooding the board
  project_number: 1          # number of your GitHub Project (see its URL)
  close_on_final_status: true  # close the issue on rejected, withdrawn, hired and discarded
  # project_owner: your-login  # only when the Project belongs to someone else than the repo owner

# Optional AI, free through GitHub Models. Off by default. Before turning it on, check in GitHub Billing
# that paid usage of GitHub Models is off, so the free limits are the only limits.
ai:
  enabled: false
  model: openai/gpt-4o-mini
  max_calls_per_run: 30
