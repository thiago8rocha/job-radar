# Comment "/evaluate" on a job issue to get a full analysis (strengths, gaps, likely interview questions).
# Needs ai.enabled in the config and the JOB_RADAR_PROFILE secret (your profile or résumé, as text).
# It uses GitHub Models with the workflow's own token, so no API key is involved.
name: evaluate
on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read
  models: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    if: ${{ !github.event.issue.pull_request && startsWith(github.event.comment.body, '/evaluate') }}
    steps:
      - uses: actions/checkout@v4          # reads job-radar.config.yml
      - uses: thiago8rocha/job-radar@v1
        with:
          command: evaluate
          github-token: ${{ secrets.JOB_RADAR_TOKEN }}
          models-token: ${{ github.token }}
          profile: ${{ secrets.JOB_RADAR_PROFILE }}
