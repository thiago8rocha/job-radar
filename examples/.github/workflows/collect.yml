# Collects new jobs every business day and opens one issue per job.
name: collect
on:
  # Fallback only. GitHub delays scheduled runs by hours before 08:00 UTC, so the README suggests an
  # external scheduler calling workflow_dispatch as the primary trigger.
  schedule:
    - cron: "17 10 * * 1-5"   # 7:17 a.m. in Brasília
    - cron: "47 16 * * 1-5"   # 1:47 p.m. in Brasília
  workflow_dispatch:
    inputs:
      dry-run:
        description: "List what would be created, without writing anything"
        type: boolean
        default: false
      force:
        description: "Run even if a collect succeeded recently"
        type: boolean
        default: false
      min-interval-hours:
        description: "Skip this run when a collect succeeded in the last N hours"
        type: string
        default: "4"

# Runs never overlap, so two of them cannot create the same issue.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write            # to commit state/seen.json and state/companies.json
  issues: write

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || false }}
          MIN_INTERVAL_HOURS: ${{ inputs.min-interval-hours || '4' }}
        run: |
          run=true
          if [ "$FORCE" != "true" ]; then
            since=$(date -u -d "$MIN_INTERVAL_HOURS hours ago" +%FT%TZ)
            n=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/collect.yml/runs" -f status=success -f created=">=$since" --jq .total_count)
            [ "$n" -gt 0 ] && run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  collect:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5          # reads the config, companies.yml and state/seen.json
      - uses: thiago8rocha/job-radar@v1
        with:
          command: collect
          github-token: ${{ secrets.JOB_RADAR_TOKEN }}
          dry-run: ${{ inputs.dry-run || false }}
          serpapi-key: ${{ secrets.SERPAPI_KEY }}   # optional: Google Jobs stays off without it
          ai-api-key: ${{ secrets.AI_API_KEY }}     # optional: only read when ai.enabled is true
          profile: ${{ secrets.JOB_RADAR_PROFILE }} # optional: your profile or résumé, only sent to the model
      # state/seen.json is what keeps already-created jobs from coming back; committing it also
      # counts as activity, so GitHub does not pause the schedule after 60 days.
      - name: Commit state
        if: ${{ always() && !inputs.dry-run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if ! git diff --cached --quiet; then
            git commit -m "chore(state): update seen jobs"
            git push
          fi
      # Keeps the Metrics issue and the Project's calculated fields current between the weekly runs.
      - uses: thiago8rocha/job-radar@v1
        if: ${{ always() }}
        with:
          command: metrics
          github-token: ${{ secrets.JOB_RADAR_TOKEN }}
          dry-run: ${{ inputs.dry-run || false }}
