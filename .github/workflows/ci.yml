name: ci
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # dist/index.cjs is what consumers run through `uses: thiago8rocha/job-radar@v1`,
      # so it must always match the source.
      - name: Check dist is up to date
        run: git diff --exit-code -- dist/index.cjs
