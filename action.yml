name: job-radar
description: Collects job postings, opens one GitHub issue per job and tracks each hiring process
author: thiago8rocha
branding:
  icon: radio
  color: blue

inputs:
  command:
    description: "One of: setup, sync-status, intake, import, collect, metrics, revalidate"
    required: true
  github-token:
    description: Token with Issues and Projects access to the private repo (a classic PAT with the repo and project scopes; the default GITHUB_TOKEN cannot write to user Projects)
    required: true
  config-path:
    description: Path to the config file in the private repo
    required: false
    default: job-radar.config.yml
  xlsx-path:
    description: Spreadsheet to import (import only)
    required: false
  companies-path:
    description: Path to the companies file in the private repo (collect and revalidate)
    required: false
    default: companies.yml
  state-path:
    description: Path to the seen-jobs state file, committed by your workflow (collect only)
    required: false
    default: state/seen.json
  dry-run:
    description: "Report what would happen without writing (import, collect, metrics and revalidate)"
    required: false
    default: "false"
  serpapi-key:
    description: SerpAPI key for Google Jobs and company discovery (used from phase 3)
    required: false

runs:
  using: node20
  main: dist/index.cjs
