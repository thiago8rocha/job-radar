name: job-radar
description: Collects job postings, opens one GitHub issue per job and tracks each hiring process
author: thiago8rocha
branding:
  icon: radio
  color: blue

inputs:
  command:
    description: "One of: setup, sync-status, intake, import, collect, metrics, revalidate, discover, evaluate"
    required: true
  github-token:
    description: Token with Issues and Projects access to the private repo (a classic PAT with the repo and project scopes; the default GITHUB_TOKEN cannot write to user Projects)
    required: true
  config-path:
    description: Path to the config file in the private repo
    required: false
    default: job-radar.config.yml
  xlsx-path:
    description: Spreadsheet to import (import only)
    required: false
  companies-path:
    description: Path to the companies file in the private repo (collect, revalidate and discover)
    required: false
    default: companies.yml
  state-path:
    description: Path to the seen-jobs state file, committed by your workflow (collect only)
    required: false
    default: state/seen.json
  dry-run:
    description: "Report what would happen without writing (import, collect, metrics, revalidate and discover)"
    required: false
    default: "false"
  serpapi-key:
    description: SerpAPI key for Google Jobs and company discovery (optional; those stay off without it)
    required: false
  ai-api-key:
    description: "API key of the AI provider set in ai.base_url, from a secret (AI_API_KEY). Only used when ai.enabled is true"
    required: false
  profile:
    description: "Your profile or résumé as text, from a secret (JOB_RADAR_PROFILE). Sent only to the model, never written anywhere. Only used when ai.enabled is true"
    required: false

runs:
  using: node20
  main: dist/index.cjs
